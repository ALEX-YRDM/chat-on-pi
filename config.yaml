app:
  host: "0.0.0.0"
  port: 8000
  debug: false
audio:
  input_device: "plughw:0,0"
  sample_rate: 16000
  channels: 1
  format: "S16_LE"
  max_record_seconds: 30
  playback_device: "default"
whisper:
  executable: "/home/zbq/whisper.cpp/build/bin/whisper-cli"
  model: "/home/zbq/whisper.cpp/models/ggml-tiny.bin"
  language: "zh"
  threads: 4
  timeout_seconds: 120
ollama:
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5:0.5b"
  temperature: 0.7
  context_message_limit: 10
  timeout_seconds: 180
piper:
  voice: "zh_CN-huayan-medium"
  # 留空时查找项目目录下 <voice>.onnx；也可以填写模型绝对路径。
  model_path: ""
  backend: "api"
  timeout_seconds: 120
conversation:
  auto_play_tts: true
  keep_user_audio: true
  keep_assistant_audio: true
